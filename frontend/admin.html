<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanPulse | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        :root {
            --bg-color: #0a0a0a; --text-color: #e0e0e0; --accent-color: #ff4d00;
            --secondary-accent: #00ff9d; --surface-color: #141414; --border-color: #333;
            --font-display: 'Archivo Black', sans-serif; --font-mono: 'Space Mono', monospace;
        }
        body { background: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .mono { font-family: var(--font-mono); }
        .display { font-family: var(--font-display); }
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.05; background: url('https://grainy-gradients.vercel.app/noise.svg'); z-index: 999; }
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .auth-box { border: 1px solid var(--border-color); padding: 3rem; background: var(--surface-color); text-align: center; }
        .auth-input { background: transparent; border: 1px solid #444; color: white; padding: 0.8rem; margin: 1rem 0; width: 200px; text-align: center; font-family: var(--font-mono); }
        .auth-btn { background: white; color: black; border: none; padding: 0.8rem 2rem; cursor: pointer; font-family: var(--font-display); text-transform: uppercase; }
        nav { padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #000; }
        .dashboard-container { flex: 1; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
        .sidebar { border-right: 1px solid var(--border-color); padding: 2rem; background: var(--surface-color); overflow-y: auto; }
        .stat-card { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #222; }
        .stat-val { font-size: 3rem; font-family: var(--font-display); line-height: 1; }
        .stat-label { color: #666; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; }
        .feed { padding: 2rem; overflow-y: auto; }
        .feed-header { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .incident-card { background: #111; border: 1px solid var(--border-color); padding: 1.5rem; margin-bottom: 1rem; display: grid; grid-template-columns: 30px 1fr auto; gap: 1.5rem; align-items: start; transition: 0.2s; }
        .incident-card:hover { border-color: #555; transform: translateX(5px); }
        .incident-card.sla-breached { border-color: #ff4d00 !important; box-shadow: 0 0 10px #ff4d0044; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); margin-top: 4px; }
        .status-indicator.resolved { background: var(--secondary-accent); box-shadow: 0 0 10px var(--secondary-accent); opacity: 0.5; }
        .incident-actions button { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 0.5rem 1rem; cursor: pointer; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; transition: 0.2s; display: block; width: 100%; margin-bottom: 0.4rem; }
        .incident-actions button:hover { background: var(--text-color); color: black; }
        .sla-badge { font-family: var(--font-mono); font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 3px; display: inline-block; margin-top: 4px; }
        .sla-badge.ok { background: #1a3a1a; color: var(--secondary-accent); border: 1px solid #00ff9d44; }
        .sla-badge.warning { background: #3a3a00; color: #ffcc00; border: 1px solid #ffcc0044; }
        .sla-badge.breached { background: #3a0a00; color: #ff4d00; border: 1px solid #ff4d0044; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .dept-badge { font-family: var(--font-mono); font-size: 0.65rem; color: #888; border: 1px solid #333; padding: 0.15rem 0.4rem; border-radius: 3px; display: inline-block; }
        .time-ago { font-family: var(--font-mono); font-size: 0.7rem; color: #555; }
        .empty-state { text-align: center; color: #444; margin-top: 4rem; font-family: var(--font-mono); }
        #hotspotMap { height: 320px; width: 100%; margin-bottom: 1rem; border: 1px solid #222; position: relative; z-index: 1; }
        @media (max-width: 900px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: 0; top: 56px; bottom: 0; width: 80%; max-width: 320px; transform: translateX(-110%); transition: transform 0.25s ease; z-index: 2000; }
            #hotspotMap { height: 220px; }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <div id="auth-screen">
        <div class="auth-box">
            <h1 class="display" style="font-size:1.5rem;margin-bottom:0.5rem;">RESTRICTED ACCESS</h1>
            <p class="mono" style="font-size:0.8rem;color:#666;">ENTER CREDENTIALS</p>
            <input type="password" id="adminPass" class="auth-input" placeholder="PASS: admin">
            <br>
            <button class="auth-btn" onclick="checkAuth()">Unlock</button>
            <p id="authError" class="mono" style="color:var(--accent-color);font-size:0.7rem;margin-top:1rem;display:none;">ACCESS DENIED</p>
        </div>
    </div>

    <nav>
        <div class="mono" style="color:var(--secondary-accent);">● SYSTEM ONLINE</div>
        <div class="display">ADMIN DASHBOARD</div>
        <button onclick="logout()" class="mono" style="background:none;border:1px solid #333;color:white;padding:0.3rem 0.8rem;cursor:pointer;">LOGOUT</button>
    </nav>

    <div id="dashboardContainer" class="dashboard-container">
        <aside class="sidebar">
            <div class="stat-card">
                <div class="stat-val" style="color:var(--accent-color);" id="totalOpen">00</div>
                <div class="stat-label">Active Incidents</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color:var(--secondary-accent);" id="totalResolved">00</div>
                <div class="stat-label">Resolved Cases</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color:#ff4d00;" id="totalSLA">00</div>
                <div class="stat-label">SLA Breaches</div>
            </div>
            <div class="stat-card">
                <div class="stat-val">100%</div>
                <div class="stat-label">System Uptime</div>
            </div>
        </aside>

        <main class="feed">
            <div id="hotspotMap"></div>
            <div class="feed-header">
                <span class="mono">INCOMING DATA STREAM</span>
                <span class="mono" id="lastUpdate">LAST SYNC: —</span>
            </div>
            <div id="incidentList"></div>
        </main>
    </div>

<script>
const API_BASE = "http://127.0.0.1:8000";
let adminMap = null;
let adminLayer = null;
let heatLayer = null;
let refreshTimer = null;

// AUTH
function checkAuth() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin') {
        document.getElementById('auth-screen').style.display = 'none';
        loadData();
        // Auto-refresh every 30 seconds
        refreshTimer = setInterval(loadData, 30000);
    } else {
        document.getElementById('authError').style.display = 'block';
    }
}
document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') checkAuth(); });
function logout() { clearInterval(refreshTimer); location.reload(); }

// LOAD DATA
async function loadData() {
    try {
        const res = await fetch(`${API_BASE}/incidents`);
        if (!res.ok) throw new Error(`GET /incidents returned ${res.status}`);
        const incidents = await res.json();
        renderStats(incidents);
        renderIncidentList(incidents);
        renderHotspotMap(incidents);
        document.getElementById("lastUpdate").innerText = "LAST SYNC: " + new Date().toLocaleTimeString();
    } catch (err) {
        console.error("Failed to load:", err);
        document.getElementById("incidentList").innerHTML = `<div class="empty-state">[ BACKEND ERROR: ${err.message} ]</div>`;
    }
}

// STATS
function renderStats(incidents) {
    const open = incidents.filter(i => i.status === "OPEN").length;
    const resolved = incidents.filter(i => i.status === "RESOLVED").length;
    const breached = incidents.filter(i => i.status === "OPEN" && isSlABreached(i)).length;
    document.getElementById('totalOpen').innerText = open.toString().padStart(2, '0');
    document.getElementById('totalResolved').innerText = resolved.toString().padStart(2, '0');
    document.getElementById('totalSLA').innerText = breached.toString().padStart(2, '0');
}

// TIME HELPERS
function timeAgo(isoString) {
    if (!isoString) return '';
    const now = new Date();
    const then = new Date(isoString);
    const diff = Math.floor((now - then) / 1000);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
}

function isSlABreached(incident) {
    if (!incident.sla_due) return false;
    return new Date() > new Date(incident.sla_due);
}

function slaCountdown(incident) {
    if (!incident.sla_due) return null;
    const now = new Date();
    const due = new Date(incident.sla_due);
    const diff = Math.floor((due - now) / 1000);

    if (diff <= 0) return { label: '⚠ SLA BREACHED', cls: 'breached' };

    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);

    if (h < 2) return { label: `⏱ ${h}h ${m}m remaining`, cls: 'warning' };
    return { label: `✓ SLA: ${h}h ${m}m left`, cls: 'ok' };
}

// TYPE METADATA
function getTypeMeta(category) {
    const t = (category || '').toLowerCase();
    if (t.indexOf('water') !== -1 || t.indexOf('sanitation') !== -1)
        return { icon: 'water_drop', color: '#00aaff', label: 'Water / Sanitation' };
    if (t.indexOf('power') !== -1 || t.indexOf('outage') !== -1)
        return { icon: 'bolt', color: '#ffd100', label: 'Power Outage' };
    if (t.indexOf('traffic') !== -1)
        return { icon: 'traffic', color: '#ff4d00', label: 'Traffic Obstruction' };
    if (t.indexOf('infrastructure') !== -1)
        return { icon: 'business', color: '#9b59b6', label: 'Infrastructure Damage' };
    return { icon: 'report_problem', color: '#888', label: category || 'Unknown' };
}

// INCIDENT LIST
function renderIncidentList(incidents) {
    const container = document.getElementById("incidentList");
    container.innerHTML = "";
    if (!incidents || incidents.length === 0) {
        container.innerHTML = '<div class="empty-state">[ NO INCIDENTS FOUND ]</div>';
        return;
    }
    incidents.forEach((incident) => {
        const isResolved = incident.status === "RESOLVED";
        const incId = incident.id;
        const meta = getTypeMeta(incident.category);
        const severityColor = incident.severity === 'HIGH' ? '#ff4d00' : incident.severity === 'MEDIUM' ? '#ffcc00' : '#00bfff';
        const sla = !isResolved ? slaCountdown(incident) : null;
        const breached = !isResolved && isSlABreached(incident);

        const card = document.createElement('div');
        card.className = 'incident-card' + (breached ? ' sla-breached' : '');
        card.style.opacity = isResolved ? '0.45' : '1';

        card.innerHTML = `
            <div class="status-indicator ${isResolved ? 'resolved' : ''}"></div>
            <div>
                <div class="mono" style="font-size:0.85rem;color:#aaa;line-height:1.9;">
                    <span class="material-icons" style="color:${meta.color};font-size:14px;vertical-align:middle;">${meta.icon}</span>
                    <b style="color:${meta.color}">${incident.category}</b>
                    &nbsp;•&nbsp;<span style="color:${severityColor};font-weight:bold;">${incident.severity}</span>
                    &nbsp;•&nbsp;<span style="color:${isResolved ? 'var(--secondary-accent)' : 'var(--accent-color)'};">${incident.status}</span><br>
                    ${incident.description}<br>
                    <span style="color:#555;font-size:0.72rem;">📍 ${incident.latitude}, ${incident.longitude}</span><br>
                    ${incident.department ? `<span class="dept-badge">🏢 ${incident.department}</span>` : ''}
                    ${incident.ref_id ? `<span class="dept-badge" style="margin-left:4px;color:#666;">REF: ${incident.ref_id}</span>` : ''}
                    ${incident.created_at ? `<span class="time-ago" style="margin-left:6px;">🕐 ${timeAgo(incident.created_at)}</span>` : ''}
                    ${sla ? `<br><span class="sla-badge ${sla.cls}">${sla.label}</span>` : ''}
                    ${isResolved && incident.resolved_at ? `<br><span class="time-ago">✓ Resolved ${timeAgo(incident.resolved_at)}</span>` : ''}
                    ${incident.image ? `<br><img src="${incident.image}" style="margin-top:8px;max-width:180px;max-height:120px;object-fit:cover;border:1px solid #333;border-radius:4px;" onclick="this.style.maxWidth=this.style.maxWidth==='100%'?'180px':'100%'" title="Click to expand">` : ''}
                </div>
            </div>
            <div class="incident-actions">
                ${!isResolved
                    ? `<button onclick="resolveIncident('${incId}')">MARK RESOLVED</button>`
                    : `<button onclick="reopenIncident('${incId}')">REOPEN</button>`
                }
            </div>
        `;
        container.appendChild(card);
    });
}

// UPDATE STATUS
async function updateIncidentStatus(incidentId, newStatus) {
    try {
        const res = await fetch(`${API_BASE}/update`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: incidentId, status: newStatus })
        });
        if (!res.ok) {
            const errText = await res.text();
            alert("Update failed: " + res.status + "\n" + errText);
            return;
        }
        loadData();
    } catch (err) {
        alert("Network error: " + err.message);
    }
}
function resolveIncident(id) { updateIncidentStatus(id, "RESOLVED"); }
function reopenIncident(id)  { updateIncidentStatus(id, "OPEN"); }

// MAP ICON
function makeIcon(meta, severity) {
    const ring = severity === 'HIGH' ? '#ff4d00' : severity === 'MEDIUM' ? '#ffcc00' : '#00bfff';
    return L.divIcon({
        className: '',
        html: `<div style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.85);border:2.5px solid ${ring};display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px ${ring}99;font-family:'Material Icons';font-size:18px;color:${meta.color};">${meta.icon}</div>`,
        iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -22]
    });
}

// MAP
function renderHotspotMap(incidents) {
    if (!window.L) return;
    const container = document.getElementById('hotspotMap');
    if (!adminMap) {
        adminMap = L.map(container).setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(adminMap);
        adminLayer = L.layerGroup().addTo(adminMap);
    }
    adminLayer.clearLayers();
    if (heatLayer) { adminMap.removeLayer(heatLayer); heatLayer = null; }

    const points = [], heatPoints = [];
    const wt = { "HIGH": 1.0, "MEDIUM": 0.6, "LOW": 0.3 };

    incidents.filter(i => i.status === "OPEN").forEach(i => {
        const lat = parseFloat(i.latitude), lng = parseFloat(i.longitude);
        if (isNaN(lat) || isNaN(lng)) return;
        points.push([lat, lng]);
        heatPoints.push([lat, lng, wt[i.severity] || 0.5]);
        const meta = getTypeMeta(i.category);
        const sc = i.severity === 'HIGH' ? '#ff4d00' : i.severity === 'MEDIUM' ? '#ffcc00' : '#00bfff';
        const marker = L.marker([lat, lng], { icon: makeIcon(meta, i.severity) });
        marker.bindPopup(`
            <div style="font-family:monospace;font-size:0.82rem;line-height:1.8;min-width:200px;">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                    <span class="material-icons" style="color:${meta.color};font-size:16px;">${meta.icon}</span>
                    <b style="color:${meta.color}">${meta.label}</b>
                </div>
                <div>${i.description}</div>
                <div>Severity: <b style="color:${sc}">${i.severity}</b></div>
                ${i.department ? `<div>Dept: <b>${i.department}</b></div>` : ''}
                ${i.created_at ? `<div style="color:#888;">Reported: ${timeAgo(i.created_at)}</div>` : ''}
                <div style="color:#888;font-size:0.75rem;">📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
            </div>
        `);
        adminLayer.addLayer(marker);
    });

    if (heatPoints.length && window.L.heatLayer) {
        heatLayer = L.heatLayer(heatPoints, {
            radius: 50, blur: 35, maxZoom: 17, max: 1.0,
            gradient: { 0.0: 'green', 0.5: 'yellow', 0.8: 'orange', 1.0: 'red' }
        }).addTo(adminMap);
    }
    if (points.length) adminMap.fitBounds(L.latLngBounds(points).pad(0.4));
    renderMapLegend();
    setTimeout(() => adminMap.invalidateSize(), 150);
}

function renderMapLegend() {
    if (document.getElementById('mapLegend')) return;
    const legend = document.createElement('div');
    legend.id = 'mapLegend';
    legend.style.cssText = 'position:absolute;bottom:10px;left:10px;z-index:1000;background:rgba(0,0,0,0.82);border:1px solid #333;padding:0.6rem 0.9rem;font-family:monospace;font-size:0.7rem;color:#ccc;pointer-events:none;line-height:2;';
    legend.innerHTML = `
        <div style="color:#aaa;margin-bottom:2px;letter-spacing:1px;font-size:0.65rem;">INCIDENT TYPES</div>
        <div><span class="material-icons" style="font-size:11px;color:#9b59b6;vertical-align:middle;">business</span> Infrastructure</div>
        <div><span class="material-icons" style="font-size:11px;color:#00aaff;vertical-align:middle;">water_drop</span> Water / Sanitation</div>
        <div><span class="material-icons" style="font-size:11px;color:#ffd100;vertical-align:middle;">bolt</span> Power Outage</div>
        <div><span class="material-icons" style="font-size:11px;color:#ff4d00;vertical-align:middle;">traffic</span> Traffic</div>
        <div style="margin-top:4px;border-top:1px solid #333;padding-top:4px;color:#aaa;font-size:0.65rem;">SEVERITY RING</div>
        <div><span style="color:#ff4d00;">⬤</span> HIGH &nbsp;<span style="color:#ffcc00;">⬤</span> MED &nbsp;<span style="color:#00bfff;">⬤</span> LOW</div>
    `;
    document.getElementById('hotspotMap').appendChild(legend);
}
</script>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
</body>
</html>
